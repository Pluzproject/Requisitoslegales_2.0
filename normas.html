<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Normas - Portal de Requisitos Legales</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        th, td { padding: 12px; border-bottom: 1px solid #dbeafe; vertical-align: top; }
        th { background-color: #f0f9ff; font-weight: 600; color: #1e3a8a; white-space: nowrap; }
        tr:hover { background-color: #eff6ff; }
        .main-container { max-width: 95%; margin: 0 auto; padding: 2rem 1rem; }
    </style>
</head>
<body class="bg-blue-50 text-blue-900 font-sans min-h-screen">

    <!-- Header con navegación y botón de cumplimiento -->
    <header class="bg-blue-900 text-white shadow-md py-6 px-8 flex flex-col md:flex-row justify-between items-center gap-4 relative">
        <div class="flex items-center space-x-4">
            <h1 class="text-2xl font-bold tracking-tight">Portal de Requisitos Legales - Base de Normas</h1>
        </div>
        <div class="flex items-center space-x-6 flex-wrap justify-center gap-4">
            <nav class="space-x-6 text-sm font-semibold">
                <a href="index.html" class="opacity-75 hover:opacity-100 transition">Indicadores</a>
                <a href="normas.html" class="underline underline-offset-4">Ver Normas (Tabla)</a>
            </nav>
            <a href="https://pluz.esginnova.com/apps/bpm/index.cfm?id_app=1360&idaplicacion=1360&desdeTop=1" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition shadow-sm flex items-center gap-2">
                Cumplimiento de normas
            </a>
        </div>
    </header>

    <main class="main-container">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            <!-- Tabla Principal -->
            <div class="lg:col-span-3 space-y-4">
                <div class="bg-white rounded-xl shadow-sm border border-blue-100 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead class="bg-blue-50">
                                <tr>
                                    <th class="w-24">Fecha</th>
                                    <th class="w-32">Norma</th>
                                    <th class="w-24">Pilar</th>
                                    <th class="w-64">Sumilla / Descripción</th>
                                    <th class="w-32">Autoridad</th>
                                    <th class="w-24">Tipo</th>
                                    <th class="w-20">Enlace</th>
                                    <th class="min-w-[400px]">Recomendación</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody" class="bg-white"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Panel de Filtros -->
            <aside class="bg-white p-6 rounded-xl border shadow-sm h-fit sticky top-6 space-y-4">
                <div id="lastUpdateDisplay" class="text-xs text-blue-600 font-medium italic border-b pb-2 mb-2"></div>
                <h2 class="font-bold text-blue-900 border-b pb-2">Filtros de Búsqueda</h2>
                
                <input type="text" id="searchInput" placeholder="Buscar norma..." class="w-full px-4 py-2 border rounded-lg text-sm">
                
                <div class="space-y-1">
                    <label class="text-xs font-bold text-gray-500">Fecha Específica</label>
                    <input type="date" id="filterFecha" class="w-full border rounded-lg text-sm px-3 py-2">
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-bold text-gray-500">Rango de Fecha</label>
                    <input type="date" id="filterFechaDesde" class="w-full border rounded-lg text-sm px-3 py-2" title="Desde">
                    <input type="date" id="filterFechaHasta" class="w-full border rounded-lg text-sm px-3 py-2" title="Hasta">
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-bold text-gray-500">Periodo (Mes/Año)</label>
                    <select id="filterMesAnio" class="w-full border rounded-lg text-sm px-3 py-2">
                        <option value="">Seleccionar...</option>
                    </select>
                </div>
                
                <div class="space-y-1">
                    <label class="text-xs font-bold text-gray-500">Año Específico</label>
                    <select id="filterAnio" class="w-full border rounded-lg text-sm px-3 py-2">
                        <option value="">Todos los Años</option>
                    </select>
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-bold text-gray-500">Categorización</label>
                    <select id="filterPilar" class="w-full border rounded-lg text-sm px-3 py-2">
                        <option value="">Todos los Pilares</option>
                    </select>
                    <select id="filterTipo" class="w-full border rounded-lg text-sm px-3 py-2">
                        <option value="">Todos los Tipos</option>
                    </select>
                </div>
                
                <button id="btnReset" class="w-full bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg text-white font-bold text-sm transition">RESET FILTROS</button>
            </aside>
        </div>
    </main>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTIGndiBxp88Vdkl1NdJ4W63zLqKeotEg8_gBqUMnSz4JHef48eET9R6A265qibhQDbZUUxe5kM-n4L/pub?output=csv';
        var rawData = []; var lastUpdateRawDate = "";

        window.addEventListener('DOMContentLoaded', function() {
            fetchData();
            var filterIds = ['searchInput', 'filterFecha', 'filterFechaDesde', 'filterFechaHasta', 'filterMesAnio', 'filterAnio', 'filterPilar', 'filterTipo'];
            for(var i = 0; i < filterIds.length; i++) {
                var el = document.getElementById(filterIds[i]);
                if(el) { el.addEventListener('change', applyFilters); el.addEventListener('input', applyFilters); }
            }
            document.getElementById('btnReset').addEventListener('click', resetDashboard);
        });

        function fetchData() {
            Papa.parse(csvUrl, {
                download: true, header: true, skipEmptyLines: true,
                complete: function(results) {
                    if (results.data.length > 0) lastUpdateRawDate = results.data[results.data.length - 1]['Fecha'] || "";
                    rawData = [];
                    for(var i = 0; i < results.data.length; i++) {
                        var row = results.data[i];
                        var normaText = (row['Norma'] || '').trim().toUpperCase();
                        if(normaText !== "" && normaText !== "SIN NOVEDAD") {
                            var partes = (row['Fecha'] || '').split('/');
                            if(partes.length === 3) {
                                row.fEstandar = partes[0].padStart(2, '0') + '/' + partes[1].padStart(2, '0') + '/' + partes[2];
                                row.rawD = partes[2] + '-' + partes[1].padStart(2, '0') + '-' + partes[0].padStart(2, '0');
                                row.mesAnio = partes[1].padStart(2, '0') + '/' + partes[2];
                                row.a = partes[2];
                            }
                            rawData.push(row);
                        }
                    }
                    populateFilters();
                    renderTable(rawData);
                }
            });
        }

        function populateFilters() {
            function getUniqueValues(key) {
                var values = [];
                for(var i = 0; i < rawData.length; i++) {
                    var val = rawData[i][key];
                    if(val && values.indexOf(val) === -1) values.push(val);
                }
                return values;
            }
            function fillSelect(id, data, sortDesc) {
                var select = document.getElementById(id);
                if(sortDesc) {
                    data.sort((a, b) => {
                        var p1 = a.split('/'); var p2 = b.split('/');
                        return new Date(p2[1], p2[0] - 1) - new Date(p1[1], p1[0] - 1);
                    });
                } else { data.sort(); }
                for(var i = 0; i < data.length; i++) {
                    var opt = document.createElement('option');
                    opt.value = data[i]; opt.textContent = data[i];
                    select.appendChild(opt);
                }
            }
            fillSelect('filterMesAnio', getUniqueValues('mesAnio'), true);
            fillSelect('filterAnio', getUniqueValues('a'), false);
            fillSelect('filterPilar', getUniqueValues('Pilar del SIG'), false);
            fillSelect('filterTipo', getUniqueValues('Tipo de norma'), false);
        }

        function renderTable(data) {
            var tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
            var reversed = data.slice().reverse();
            if (lastUpdateRawDate) document.getElementById('lastUpdateDisplay').textContent = "Última act: " + lastUpdateRawDate;

            for(var i = 0; i < reversed.length; i++) {
                var item = reversed[i];
                var tr = document.createElement('tr');
                tr.innerHTML = '<td>' + (item.fEstandar || item['Fecha'] || '-') + '</td>' +
                               '<td class="font-bold">' + (item['Norma'] || '-') + '</td>' +
                               '<td>' + (item['Pilar del SIG'] || '-') + '</td>' +
                               '<td class="text-xs">' + (item['Sumilla / Descripción'] || '-') + '</td>' +
                               '<td class="text-xs">' + (item['Autoridad'] || '-') + '</td>' +
                               '<td class="text-xs">' + (item['Tipo de norma'] || '-') + '</td>' +
                               '<td>' + (item['Enlace'] && item['Enlace'] !== '--' ? '<a href="' + item['Enlace'] + '" target="_blank" class="text-blue-600 underline">Ver</a>' : '-') + '</td>' +
                               '<td class="text-xs italic">' + (item['Recomendación'] || '-') + '</td>';
                tbody.appendChild(tr);
            }
        }

        function applyFilters() {
            var s = document.getElementById('searchInput').value.toLowerCase();
            var d = document.getElementById('filterFecha').value;
            var start = document.getElementById('filterFechaDesde').value;
            var end = document.getElementById('filterFechaHasta').value;
            var ma = document.getElementById('filterMesAnio').value;
            var an = document.getElementById('filterAnio').value;
            var pi = document.getElementById('filterPilar').value;
            var ti = document.getElementById('filterTipo').value;

            var filtered = [];
            for(var i = 0; i < rawData.length; i++) {
                var item = rawData[i];
                var matchS = (item['Norma'].toLowerCase().includes(s) || item['Sumilla / Descripción'].toLowerCase().includes(s));
                var matchD = (!d || item.rawD === d);
                var matchRange = (!start || item.rawD >= start) && (!end || item.rawD <= end);
                var matchMA = (!ma || item.mesAnio === ma);
                var matchAN = (!an || item.a === an);
                var matchPI = (!pi || item['Pilar del SIG'] === pi);
                var matchTI = (!ti || item['Tipo de norma'] === ti);
                
                if(matchS && matchD && matchRange && matchMA && matchAN && matchPI && matchTI) {
                    filtered.push(item);
                }
            }
            renderTable(filtered);
        }

        function resetDashboard() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterFecha').value = '';
            document.getElementById('filterFechaDesde').value = '';
            document.getElementById('filterFechaHasta').value = '';
            document.getElementById('filterMesAnio').value = '';
            document.getElementById('filterAnio').value = '';
            document.getElementById('filterPilar').value = '';
            document.getElementById('filterTipo').value = '';
            renderTable(rawData);
        }
    </script>
</body>
</html>
