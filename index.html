<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Portal de Requisitos Legales</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #2c3e50;
        }
        .bg-corporate-blue { background-color: #3B599F; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-8 space-y-6 border border-slate-100">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold" style="color: #3B599F;">Portal SIG</h1>
            <p class="text-xs text-slate-500">Gestión de Requisitos Legales</p>
        </div>

        <!-- Formulario de Login -->
        <div class="space-y-4">
            <div class="space-y-1">
                <label class="text-xs font-bold text-slate-600">Administrador</label>
                <input type="text" id="userInput" placeholder="12345678" class="w-full px-4 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 border-slate-300">
            </div>

            <div class="space-y-1">
                <label class="text-xs font-bold text-slate-600">Contraseña</label>
                <input type="password" id="passInput" placeholder="••••••••" class="w-full px-4 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 border-slate-300">
            </div>

            <div id="errorMsg" class="text-xs text-red-600 font-semibold hidden text-center bg-red-50 p-2 rounded-lg">
                Usuario o contraseña incorrectos.
            </div>

            <button onclick="handleLogin()" class="w-full py-3 rounded-xl text-white font-bold text-sm transition shadow-sm bg-corporate-blue hover:opacity-90">
                Iniciar Sesión
            </button>

            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink mx-4 text-xs text-slate-400 uppercase">O bien</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <!-- Enlace directo para usuario público -->
            <a href="indicadores.html" onclick="handlePublicAccess()" class="block text-center w-full py-3 rounded-xl text-slate-700 font-bold text-sm transition shadow-sm bg-slate-100 hover:bg-slate-200">
                Ingresar como Usuario Público
            </a>
        </div>
    </div>

    <script>
        const administradoresValidos = [
            { usuario: "43662282", password: "123" },
            { usuario: "12345678", password: "123" },
            { usuario: "87654321", password: "123" }
        ];

        function handleLogin() {
            var user = document.getElementById('userInput').value.trim();
            var pass = document.getElementById('passInput').value.trim();
            var errorBox = document.getElementById('errorMsg');

            if(!user || !pass) {
                errorBox.textContent = "Por favor ingrese su usuario y contraseña.";
                errorBox.classList.remove('hidden');
                return;
            }

            var autorizado = false;
            for(var i = 0; i < administradoresValidos.length; i++) {
                if(administradoresValidos[i].usuario === user && administradoresValidos[i].password === pass) {
                    autorizado = true;
                    break;
                }
            }

            if(autorizado) {
                sessionStorage.setItem('userRole', 'admin');
                sessionStorage.setItem('userName', user);
                // Redirige al panel de indicadores con privilegios de administrador
                window.location.href = 'indicadores.html'; 
            } else {
                errorBox.textContent = "Credenciales incorrectas o usuario no registrado como administrador.";
                errorBox.classList.remove('hidden');
            }
        }

        function handlePublicAccess() {
            sessionStorage.setItem('userRole', 'public');
            sessionStorage.setItem('userName', 'Usuario Público');
        }
    </script>
</body>
</html>
