<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Portal de Requisitos Legales</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #2c3e50;
        }
        .bg-corporate-blue { background-color: #3B599F; }
        .text-corporate-blue { color: #3B599F; }
        .border-corporate-blue { border-color: #3B599F; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md space-y-6 border border-slate-100">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold text-corporate-blue">Portal de Requisitos Legales</h1>
            <p class="text-xs text-slate-500">Ingrese su usuario y contraseña o acceda como público</p>
        </div>
        
        <!-- Formulario de Login Tradicional -->
        <form id="loginForm" class="space-y-4">
            <div class="space-y-1">
                <label class="text-xs font-bold text-slate-500">Usuario / DNI</label>
                <input type="text" id="userInput" required class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 border-slate-300" placeholder="Ej. 43662282 o 55555555">
            </div>
            
            <div class="space-y-1">
                <label class="text-xs font-bold text-slate-500">Contraseña</label>
                <input type="password" id="passInput" required class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 border-slate-300" placeholder="••••••">
            </div>

            <button type="submit" class="w-full py-3 rounded-xl text-white font-bold text-sm transition shadow-sm bg-corporate-blue hover:opacity-90 cursor-pointer">
                Iniciar Sesión
            </button>
            
            <p id="errorMsg" class="text-xs text-red-500 text-center font-medium hidden">Usuario o contraseña incorrectos.</p>
        </form>

        <div class="relative flex py-1 items-center">
            <div class="flex-grow border-t border-slate-200"></div>
            <span class="flex-shrink mx-4 text-xs text-slate-400 font-semibold uppercase">O</span>
            <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <!-- Acceso como Usuario Público -->
        <div>
            <button type="button" onclick="loginAsPublic()" class="w-full py-3 rounded-xl font-bold text-sm transition shadow-sm border border-corporate-blue text-corporate-blue hover:bg-blue-50 flex items-center justify-center gap-2 cursor-pointer">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                <span>Ingresar como Usuario Público</span>
            </button>
            <p class="text-[11px] text-slate-400 mt-2 text-center">Acceso directo a Normas e Indicadores sin contraseña.</p>
        </div>
    </div>

    <script>
        // ⚠️ REEMPLAZA ESTE ENLACE con el enlace CSV publicado de tu pestaña de Usuarios
        const usuariosCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTIGndiBxp88Vdkl1NdJ4W63zLqKeotEg8_gBqUMnSz4JHef48eET9R6A265qibhQDbZUUxe5kM-n4L/pub?gid=1030806553&single=true&output=csv';

        function loginAsPublic() {
            sessionStorage.setItem('userRole', 'publico');
            window.location.href = 'normas.html';
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var userVal = document.getElementById('userInput').value.trim();
            var passVal = document.getElementById('passInput').value.trim();
            var errorMsg = document.getElementById('errorMsg');
            errorMsg.classList.add('hidden');

            Papa.parse(usuariosCsvUrl, {
                download: true,
                header: false, // Leemos por índices de columna para mayor precisión
                skipEmptyLines: true,
                complete: function(results) {
                    var rows = results.data;
                    var loggedIn = false;

                    // Empezamos desde i = 1 para saltar la fila de encabezados
                    for (var i = 1; i < rows.length; i++) {
                        var row = rows[i];
                        var dbUser  = (row[0] || '').trim();
                        var dbPass  = (row[1] || '').trim();
                        var dbRol   = (row[2] || '').trim().toLowerCase();
                        var dbPilar = (row[3] || '').trim();

                        if (dbUser === userVal && dbPass === passVal) {
                            loggedIn = true;
                            
                            // Guardamos el rol normalizado y el pilar asignado
                            var rolNormalizado = (dbRol.includes('admin')) ? 'admin' : 'validador';
                            sessionStorage.setItem('userRole', rolNormalizado);
                            sessionStorage.setItem('pilarValidador', dbPilar);

                            // Redirección al panel de validación
                            window.location.href = 'validacion.html';
                            break;
                        }
                    }

                    if (!loggedIn) {
                        errorMsg.classList.remove('hidden');
                    }
                },
                error: function(err) {
                    console.error("Error al leer usuarios:", err);
                    errorMsg.textContent = "Error al conectar con la lista de usuarios.";
                    errorMsg.classList.remove('hidden');
                }
            });
        });
    </script>
</body>
</html>
