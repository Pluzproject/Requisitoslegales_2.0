<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Portal de Requisitos Legales</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Incluimos PapaParse para leer la hoja de Usuarios -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #2c3e50;
        }
        .bg-corporate-blue { background-color: #3B599F; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-8 space-y-6 border border-slate-100">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-bold" style="color: #3B599F;">Portal SIG</h1>
            <p class="text-xs text-slate-500">Gestión de Requisitos Legales</p>
        </div>

        <!-- Formulario de Login -->
        <div class="space-y-4">
            <div class="space-y-1">
                <label class="text-xs font-bold text-slate-600">Usuario / Administrador</label>
                <input type="text" id="userInput" placeholder="Ingrese su usuario..." class="w-full px-4 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 border-slate-300">
            </div>

            <div class="space-y-1">
                <label class="text-xs font-bold text-slate-600">Contraseña</label>
                <input type="password" id="passInput" placeholder="••••••••" class="w-full px-4 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 border-slate-300">
            </div>

            <div id="errorMsg" class="text-xs text-red-600 font-semibold hidden text-center bg-red-50 p-2 rounded-lg">
                Usuario o contraseña incorrectos.
            </div>

            <button onclick="handleLogin()" class="w-full py-3 rounded-xl text-white font-bold text-sm transition shadow-sm bg-corporate-blue hover:opacity-90">
                Iniciar Sesión
            </button>

            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink mx-4 text-xs text-slate-400 uppercase">O bien</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <!-- Enlace directo para usuario público -->
            <a href="indicadores.html" onclick="handlePublicAccess()" class="block text-center w-full py-3 rounded-xl text-slate-700 font-bold text-sm transition shadow-sm bg-slate-100 hover:bg-slate-200">
                Ingresar como Usuario Público
            </a>
        </div>
    </div>

    <script>
        // Enlace CSV de la pestaña "Usuarios" de tu Google Sheets
        const usuariosCsvUrl = 'TU_ENLACE_CSV_DE_LA_HOJA_USUARIOS'; 

        const administradoresValidos = [
            { usuario: "43662282", password: "123" },
            { usuario: "12345678", password: "123" },
            { usuario: "87654321", password: "123" }
        ];

        function handleLogin() {
            var user = document.getElementById('userInput').value.trim();
            var pass = document.getElementById('passInput').value.trim();
            var errorBox = document.getElementById('errorMsg');

            if(!user || !pass) {
                errorBox.textContent = "Por favor ingrese su usuario y contraseña.";
                errorBox.classList.remove('hidden');
                return;
            }

            errorBox.classList.add('hidden');

            // 1. Verificar si es Administrador (Acceso rápido local)
            var autorizadoAdmin = false;
            for(var i = 0; i < administradoresValidos.length; i++) {
                if(administradoresValidos[i].usuario === user && administradoresValidos[i].password === pass) {
                    autorizadoAdmin = true;
                    break;
                }
            }

            if(autorizadoAdmin) {
                sessionStorage.setItem('userRole', 'admin');
                sessionStorage.setItem('userName', user);
                window.location.href = 'indicadores.html'; 
                return;
            }

            // 2. Si no es admin, verificar en la hoja "Usuarios" (Columnas D, E, F)
            errorBox.textContent = "Verificando credenciales...";
            errorBox.classList.remove('hidden');

            Papa.parse(usuariosCsvUrl, {
                download: true,
                header: false, // Usamos índices de matriz para mayor precisión
                skipEmptyLines: true,
                complete: function(results) {
                    var filas = results.data;
                    var validadorEncontrado = false;
                    var pilarAsignado = "";

                    // Omitimos la cabecera (empezamos en i = 1)
                    for (var i = 1; i < filas.length; i++) {
                        var fila = filas[i];
                        var colUsuarioD = (fila[3] || '').trim(); // Columna D (Índice 3)
                        var colPassE     = (fila[4] || '').trim(); // Columna E (Índice 4)
                        var colPilarF    = (fila[5] || '').trim(); // Columna F (Índice 5)

                        if (user === colUsuarioD && pass === colPassE) {
                            validadorEncontrado = true;
                            pilarAsignado = colPilarF;
                            break;
                        }
                    }

                    if (validadorEncontrado) {
                        // Guardamos rol y pilar asignado en sessionStorage
                        sessionStorage.setItem('userRole', 'validador');
                        sessionStorage.setItem('userName', user);
                        sessionStorage.setItem('pilarValidador', pilarAsignado);
                        
                        // Redirige al panel de validación
                        window.location.href = 'validacion.html';
                    } else {
                        errorBox.textContent = "Usuario o contraseña incorrectos.";
                        errorBox.classList.remove('hidden');
                    }
                },
                error: function(err) {
                    console.error("Error al leer usuarios:", err);
                    errorBox.textContent = "Error al conectar con la base de datos de usuarios.";
                    errorBox.classList.remove('hidden');
                }
            });
        }

        function handlePublicAccess() {
            sessionStorage.setItem('userRole', 'public');
            sessionStorage.setItem('userName', 'Usuario Público');
        }
    </script>
</body>
</html>
